<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KineticPay - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f8fafc;
        }

        .login-container {
            min-height: 100vh;
        }

        .login-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 700;
        }

        .brand-subtitle {
            color: #6c757d;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-login {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 28px;
            font-weight: bold;
        }

        .register-link {
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container login-container d-flex align-items-center justify-content-center">

    <div class="col-lg-4 col-md-6 col-sm-10">

        <div class="card login-card">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">

                    <div class="logo-circle mb-3">
                        P
                    </div>

                    <h2 class="brand-title">
                        Merchant Login
                    </h2>

                    <p class="brand-subtitle">
                        Sign in to manage your orders and payments
                    </p>

                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >
                    </div>

                    <div class="d-grid">
                        <button
                            type="submit"
                            class="btn btn-primary btn-login"
                        >
                            Login
                        </button>
                    </div>

                </form>

                <hr class="my-4">

                <div class="text-center">

                    <p class="mb-0">
                        Don't have an account?
                        <a href="{% url 'merchant_register' %}" class="register-link">
                            Register Here
                        </a>
                    </p>

                </div>

            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
