<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KineticPay - Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
            min-height: 100vh;
        }

        .register-wrapper {
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .register-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 28px;
            font-weight: bold;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 700;
        }

        .brand-subtitle {
            color: #6c757d;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-register {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

        .login-link {
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .help-text {
            font-size: 0.85rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container register-wrapper">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card register-card">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <div class="logo-circle mb-3">
                            P
                        </div>

                        <h2 class="brand-title">
                            Merchant Registration
                        </h2>

                        <p class="brand-subtitle">
                            Create your merchant account and start receiving orders
                        </p>

                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row">

                            <!-- Account Information -->

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="col-12 mb-3">
                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <!-- Business Information -->

                            <div class="col-12 mb-3">
                                <label class="form-label">
                                    Business Name
                                </label>

                                <input
                                    type="text"
                                    name="business_name"
                                    class="form-control"
                                    placeholder="Example: XYZ Coffee Shop"
                                    required
                                >
                            </div>

                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Business Slug
                                </label>

                                <input
                                    type="text"
                                    name="slug"
                                    class="form-control"
                                    placeholder="example-store"
                                    required
                                >

                                <div class="help-text mt-1">
                                    Your public order form will be:
                                    <strong>
                                        yourdomain.com/example-store
                                    </strong>
                                </div>

                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    WhatsApp Number
                                </label>

                                <input
                                    type="text"
                                    name="whatsapp_number"
                                    class="form-control"
                                    placeholder="01XXXXXXXXX"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-4">
                                <label class="form-label">
                                    bKash/Nagad Payment Number
                                </label>

                                <input
                                    type="text"
                                    name="mfs_payment_number"
                                    class="form-control"
                                    placeholder="01XXXXXXXXX"
                                    required
                                >
                            </div>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-register"
                            >
                                Create Merchant Account
                            </button>

                        </div>

                    </form>

                    <hr class="my-4">

                    <div class="text-center">

                        <p class="mb-0">
                            Already have an account?
                            <a href="{% url 'merchant_login' %}"
                               class="login-link">
                                Login Here
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
